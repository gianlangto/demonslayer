<script>
  function build() {
    document.querySelectorAll('.track').forEach(track => {
      if (!track.dataset.orig) track.dataset.orig = track.innerHTML;
      track.innerHTML = track.dataset.orig;
      const setW = track.scrollWidth;
      const copies = Math.ceil(window.innerWidth / setW) + 1;
      track.innerHTML = track.dataset.orig.repeat(copies);
      track.style.setProperty('--shift', setW + 'px');
    });
  }
build();
window.addEventListener('resize', build);
</script>
